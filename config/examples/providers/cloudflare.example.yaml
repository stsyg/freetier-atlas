provider:
  id: cloudflare
  name: Cloudflare
  official_domains:
    - cloudflare.com
    - developers.cloudflare.com

sources:
  - id: cloudflare-workers-limits
    type: html
    trust_level: official
    url: https://developers.cloudflare.com/workers/platform/limits/
    schedule_ref: official_pages
    extraction_profile: cloudflare_workers_limits

  - id: cloudflare-pages-limits
    type: html
    trust_level: official
    url: https://developers.cloudflare.com/pages/platform/limits/
    schedule_ref: official_pages
    extraction_profile: cloudflare_pages_limits

  - id: cloudflare-pages-pricing
    type: html
    trust_level: official
    url: https://developers.cloudflare.com/pages/functions/pricing/
    schedule_ref: official_pages
    extraction_profile: pricing_document

  - id: cloudflare-changelog
    type: rss
    trust_level: official
    url: https://developers.cloudflare.com/changelog/
    schedule_ref: rss

  - id: cloudflare-docs-mcp
    type: mcp
    trust_level: official
    schedule_ref: mcp_documentation
    capabilities:
      - documentation_search
      - documentation_fetch

publishing:
  automatic_threshold: 0.90
  uncertain_threshold: 0.70
  require_official_source: true
  require_deterministic_numeric_validation: true

# Declared service -> canonical category mapping (F008 slice S1).
#
# The key is the service's canonical_name exactly as it appears in the extracted
# candidate facts' `service` field; the value must be one of the fourteen
# canonical slugs in apps/api/app/read_api/taxonomy.py (decision D025).
#
# This is DECLARED metadata with a stated rationale, never inferred. A service
# that is not listed here stays uncategorised (service.category_id IS NULL) and
# is reported honestly in the `uncategorized` rollup -- unknown is better than
# guessed. Cloudflare offers many more services than the two below; they are
# deliberately absent until an official source actually publishes them.
service_categories:
  # Workers runs user code per request with no server to manage: the textbook
  # "Serverless functions" category.
  Cloudflare Workers: serverless-functions
  # Pages hosts a deployed web application (build + deploy + custom domains).
  # It is not a container runtime, but "Containers and application hosting" is
  # the taxonomy's application-hosting category and the only honest fit; the
  # taxonomy has no separate static-site/app-platform category.
  Cloudflare Pages: containers-app-hosting

# Explicit provider x category coverage (F008 slice S2).
#
# All fourteen canonical categories MUST appear. A pair with no declaration is a
# config error, not an implicit "unknown": the whole point of the slice is that
# every provider x category pair carries a deliberate, reviewable state instead
# of being inferred from missing data.
#
# States: verified_free | offered_no_z0 | not_offered | incomplete | stale |
#         conflicting | unknown
#
# Honesty rules (enforced by the config schema AND by database CHECK
# constraints, so a raw INSERT cannot bypass them):
#   * not_offered REQUIRES a rationale -- asserting absence is a claim.
#   * verified_free / offered_no_z0 REQUIRE a `source` (declared above) or an
#     `evidence_url` -- never publish an unsupported free claim.
#   * at least three entries must be evidence-backed verified_free /
#     offered_no_z0 (decision Q9-A), so an all-unknown file cannot load.
#
# `unknown` is the honest default. It means "nobody has checked", NOT "the
# provider does not offer this" -- the latter must be declared explicitly with a
# rationale.
coverage:
  compute-vms:
    # Cloudflare's platform is edge/serverless; it publishes no general-purpose
    # virtual-machine product at all, so this is a genuine absence rather than
    # something unverified.
    state: not_offered
    rationale: >-
      Cloudflare publishes no general-purpose VM/IaaS product; its compute
      offering is the Workers edge runtime, declared under serverless-functions.
  containers-app-hosting:
    # Pages is the application-hosting fit in this taxonomy (see the
    # service_categories note above); its free tier requires no card.
    state: verified_free
    source: cloudflare-pages-limits
  serverless-functions:
    state: verified_free
    source: cloudflare-workers-limits
  networking-cdn-dns:
    # The Cloudflare Free plan includes CDN and authoritative DNS with no card.
    state: verified_free
    evidence_url: https://www.cloudflare.com/plans/
  relational-databases:
    state: unknown
  nosql-key-value:
    state: unknown
  object-file-storage:
    state: unknown
  queues-messaging-jobs:
    state: unknown
  auth-identity:
    state: unknown
  cicd-source-control:
    state: unknown
  monitoring-logs-tracing:
    state: unknown
  ai-inference-embeddings:
    state: unknown
  email-notifications-comms:
    state: unknown
  secrets-config-devtools:
    state: unknown
