provider:
  id: cloudflare
  name: Cloudflare
  official_domains:
    - cloudflare.com
    - developers.cloudflare.com

sources:
  - id: cloudflare-workers-limits
    type: html
    trust_level: official
    url: https://developers.cloudflare.com/workers/platform/limits/
    schedule_ref: official_pages
    extraction_profile: cloudflare_workers_limits

  - id: cloudflare-pages-limits
    type: html
    trust_level: official
    url: https://developers.cloudflare.com/pages/platform/limits/
    schedule_ref: official_pages
    extraction_profile: cloudflare_pages_limits

  - id: cloudflare-pages-pricing
    type: html
    trust_level: official
    url: https://developers.cloudflare.com/pages/functions/pricing/
    schedule_ref: official_pages
    extraction_profile: pricing_document

  - id: cloudflare-changelog
    type: rss
    trust_level: official
    url: https://developers.cloudflare.com/changelog/
    schedule_ref: rss

  - id: cloudflare-docs-mcp
    type: mcp
    trust_level: official
    schedule_ref: mcp_documentation
    capabilities:
      - documentation_search
      - documentation_fetch

publishing:
  automatic_threshold: 0.90
  uncertain_threshold: 0.70
  require_official_source: true
  require_deterministic_numeric_validation: true

# Declared service -> canonical category mapping (F008 slice S1).
#
# The key is the service's canonical_name exactly as it appears in the extracted
# candidate facts' `service` field; the value must be one of the fourteen
# canonical slugs in apps/api/app/read_api/taxonomy.py (decision D025).
#
# This is DECLARED metadata with a stated rationale, never inferred. A service
# that is not listed here stays uncategorised (service.category_id IS NULL) and
# is reported honestly in the `uncategorized` rollup -- unknown is better than
# guessed. Cloudflare offers many more services than the two below; they are
# deliberately absent until an official source actually publishes them.
service_categories:
  # Workers runs user code per request with no server to manage: the textbook
  # "Serverless functions" category.
  Cloudflare Workers: serverless-functions
  # Pages hosts a deployed web application (build + deploy + custom domains).
  # It is not a container runtime, but "Containers and application hosting" is
  # the taxonomy's application-hosting category and the only honest fit; the
  # taxonomy has no separate static-site/app-platform category.
  Cloudflare Pages: containers-app-hosting
