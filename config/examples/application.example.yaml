application:
  name: FreeTier Atlas
  public_url: http://localhost:3000
  api_url: http://localhost:8000
  environment: development

catalogue:
  default_zero_cost_classes:
    - Z0_TRUE_FREE
  hide_temporary_offers_by_default: true
  raw_snapshot_retention_days: 90

admin:
  # The admin allowlist is NOT declared here. It lives only in the
  # ADMIN_ALLOWLIST environment variable (Settings.admin_allowlist), so there is
  # exactly one place that grants or revokes admin access.
  authentication: github

features:
  public_adviser: true
  rss: true
  discord: false
  web_push: false
