name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No secrets are used by CI. Read-only access is sufficient.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint, format, tests
    runs-on: ubuntu-latest
    # This job previously ran `pytest` with no database at all. Every
    # integration test is guarded by `skipif(not DATABASE_URL)`, so the whole
    # ingest, reconcile, read-API and provider layer -- 162 tests -- silently
    # skipped and the job still reported success. A green tick that certifies
    # nothing is worse than a red one, because it is trusted. The service
    # container below is what makes the tick mean something.
    services:
      postgres:
        # Matches docker-compose.yml's postgres service exactly, so CI exercises
        # the same major version the development stack runs. A different major
        # would make CI's result inapplicable to the stack it is meant to guard.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas # pragma: allowlist secret
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        # Without a health check the job races the database: pytest can start
        # before Postgres accepts connections, the connection fails, and the
        # failure looks like a test defect rather than a startup order defect.
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Job scope, deliberately: `alembic upgrade head` and `pytest` BOTH need
    # this. Setting it on the pytest step alone would leave the migration step
    # falling back to migrations/env.py's local default host (`postgres`), which
    # does not resolve on the runner. These are non-secret CI-local values for
    # an ephemeral container that is destroyed with the job.
    env:
      DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python runtime and dev dependencies
        # Install the project (runtime dependencies) plus the dev extras and the
        # editable app package so the test suite can import the application.
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      # A named step of its own, not folded into the pytest command: when the
      # schema is the thing that broke, the job's step list says so directly
      # instead of reporting a wall of failing tests.
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Pytest
        run: pytest -q

  node:
    name: Node format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Node dev tools
        run: npm ci
      - name: Prettier check
        run: npm run format:check
      - name: ESLint
        run: npm run lint

  web:
    name: Web type-check, tests, and build
    runs-on: ubuntu-latest
    # Before this job, apps/web received exactly ONE CI operation in the whole
    # workflow: `npm audit` in the `dependencies` job, which reads the lockfile
    # and installs nothing. The `node` job above runs `npm ci` with no
    # working-directory -- the repository root -- and the root package.json
    # declares no `workspaces`, so that install cannot reach this package.
    #
    # apps/web nonetheless declares `tsc -b`, `vitest run` (9 files, 110 tests)
    # and `vite build`, and apps/web/Dockerfile executes `npm ci` and
    # `npm run build` to produce the assets that actually ship. None of it ran
    # here. A TypeScript error or a failing web test merged green, and not one
    # of the 336 `integrity` digests in apps/web/package-lock.json was enforced
    # by anything, because only `npm ci` checks them and `npm audit` does not.
    #
    # A separate job rather than more steps on `node`, deliberately: the jobs
    # run in parallel, so this adds no critical path while `python` (a full
    # toolchain install plus the suite against a postgres service container)
    # remains the long pole, and a red check named for the web app is
    # attributable without opening a log -- which the same failure buried in a
    # job called "Node format and lint" would not be.
    defaults:
      run:
        # Every `run` step here belongs to this package. Set once on the job
        # rather than repeated per step; `uses` steps are unaffected.
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the other Node jobs, apps/web's own `engines.node` (>=20)
          # and the node:20-alpine base in apps/web/Dockerfile, so CI exercises
          # the major version the image is built with.
          node-version: "20"
      - name: Install apps/web dependencies
        id: web_install
        run: npm ci
      # Its own step rather than being left to `npm run build`, which is
      # `tsc -b && vite build`. Folded together, a type error and a bundler
      # error land on the same line of the step list and neither gate can be
      # shown to fail on its own -- and a gate nobody can make fail is worse
      # than no gate, because it reads as coverage.
      - name: TypeScript type check
        if: ${{ !cancelled() && steps.web_install.outcome == 'success' }}
        run: npm run typecheck
      # Runs even when the type check failed, following the same rule the
      # `dependencies` job states: one finding must not hide the rest. That is
      # load-bearing here rather than tidy, because Vitest transforms
      # TypeScript with esbuild, which strips types WITHOUT checking them -- so
      # a type error does not fail a test run, and gating this step on the
      # previous one would let a type error mask a genuinely failing test.
      #
      # Conditioned on the install rather than on `!cancelled()` alone: with no
      # node_modules the remaining steps report a missing binary, which is
      # noise dressed as a finding.
      - name: Vitest
        if: ${{ !cancelled() && steps.web_install.outcome == 'success' }}
        run: npm test
      - name: Vite production build
        if: ${{ !cancelled() && steps.web_install.outcome == 'success' }}
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # Full history so the baseline validator can resolve the fork point with
      # origin/main and compare against it. A shallow clone has no merge base,
      # which would silently downgrade the directional checks to skipped.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install detect-secrets
        run: python -m pip install --disable-pip-version-check detect-secrets==1.5.0
      # Runs BEFORE the scan, deliberately. detect-secrets-hook REWRITES the
      # baseline when it decides to update it, so scanning first would repair the
      # corruption in place and measure the repair instead of the committed state.
      # Measured on Linux: a baseline whose keys were backslashed by a Windows
      # write is silently rewritten back to posix by the hook, and without this
      # step the corrupted commit is the thing that ships.
      - name: Validate secrets baseline
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          python scripts/check_secrets_baseline.py --require-reference
      # detect-secrets-hook exits 0 clean, 1 findings, and 3 when it has REWRITTEN
      # the baseline. Two forms were rejected before this one, each of which keeps
      # one necessary property and loses the other:
      #
      #   git ls-files -z | xargs -0 ...  null-safe, but `xargs` collapses every
      #                                   child code from 1 to 125 into 123, so
      #                                   "a secret was found" and "the baseline
      #                                   changed under us" are indistinguishable.
      #   ... $(git ls-files)             keeps the true code, but word-splits on
      #                                   whitespace. MEASURED: a secret planted in
      #                                   'q2 dir/has space.txt' exits 0 - a silent
      #                                   pass on a real secret, in the one route
      #                                   that blocks a merge.
      #
      # Reading NUL-delimited names into an array keeps both.
      - name: Scan tracked files against baseline
        shell: bash
        run: |
          set -o pipefail
          status=0
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(git ls-files -z)
          echo "Scanning ${#files[@]} tracked file(s)."
          detect-secrets-hook --baseline .secrets.baseline "${files[@]}" || status=$?
          case "${status}" in
            0) echo "Secret scan clean." ;;
            1) echo "::error::detect-secrets found a secret that is not in the baseline."; exit 1 ;;
            3) echo "::error::detect-secrets REWROTE .secrets.baseline. This is not a finding: the committed baseline is stale or was written on a platform that uses a different path separator. Refresh it with scripts/refresh_secrets_baseline.py and commit the result."; git --no-pager diff --stat -- .secrets.baseline; exit 1 ;;
            *) echo "::error::detect-secrets exited ${status}."; exit "${status}" ;;
          esac
      # Disclosure guard: every URL host in a tracked file must be on the
      # reviewed public allowlist. Stdlib-only, so it needs no install step.
      # Kept inside this job rather than a new one so the existing required
      # check name is unchanged.
      - name: URL host allowlist
        run: python scripts/check_urls.py

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit==2.9.0
      # apps/api/Dockerfile installs exactly this file into the runtime image,
      # so it is the production Python surface. It was previously audited by
      # nothing: this job only ever read requirements-dev.txt, which contains
      # development tooling that never ships.
      - name: Audit Python production dependencies (apps/api)
        run: pip-audit -r apps/api/requirements.txt
      # Every audit below runs even when an earlier one fails, so one finding
      # never hides the rest. The job still fails: this reports more, not less.
      #
      # apps/worker/Dockerfile installs this second file into the worker and
      # scheduler image. It is a subset of the API's pins, but a subset is not
      # a duplicate: it can drift, and auditing apps/api alone would leave a
      # shipped image uncovered.
      - name: Audit Python production dependencies (apps/worker)
        if: ${{ !cancelled() }}
        run: pip-audit -r apps/worker/requirements.txt
      - name: Audit Python development dependencies
        if: ${{ !cancelled() }}
        run: pip-audit -r requirements-dev.txt
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: "20"
      # Audited WITH development dependencies, deliberately. `--omit=dev` cannot
      # fail here and so carries no information: the root package declares zero
      # production dependencies, and apps/web's two production dependencies
      # carry no advisories, so both commands reduce to a guaranteed
      # "found 0 vulnerabilities". The development tree is genuine build-time
      # exposure -- apps/web/Dockerfile runs `npm ci` with it present to produce
      # the static assets that ship -- so it is the surface worth gating on.
      - name: Audit Node dependencies (repo root tooling)
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high
      # apps/web is a separate install (the root package declares no npm
      # workspaces), so a root-only audit never reads it.
      - name: Audit Node dependencies (apps/web)
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: npm audit --audit-level=high
