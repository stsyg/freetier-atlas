name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No secrets are used by CI. Read-only access is sufficient.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint, format, tests
    runs-on: ubuntu-latest
    # This job previously ran `pytest` with no database at all. Every
    # integration test is guarded by `skipif(not DATABASE_URL)`, so the ENTIRE
    # ingest, reconcile, read-API and provider layer silently skipped and the
    # job still reported success. A green tick that certifies nothing is worse
    # than a red one, because it is trusted. The service container below is
    # what makes the tick mean something.
    #
    # The SIZE of that layer is a MEASUREMENT, and it is written here as one.
    # The previous revision of this comment read "-- 162 tests --" with no date
    # and no command: a figure that was true when written, drifted as the suite
    # grew, and kept reading as present tense the whole time. That is this
    # job's own defect one level up -- a statement trusted because nothing
    # marked it stale -- so the number is now stated as a dated reading of a
    # named command rather than as a fact about the repository.
    #
    # MEASURED 2026-08-25 against postgres:16-alpine, `python -m pytest -q`,
    # taking the count as the DIFFERENCE in `skipped` between the two runs:
    #   without DATABASE_URL : 2601 passed, 261 skipped
    #   with    DATABASE_URL : 2859 passed,   3 skipped
    # so 258 tests were gated on the database that day, not 162.
    #
    # Do not hand-edit that number. Either re-run both commands and restate the
    # date, or drop the figure entirely and keep the INVARIANT, which is the
    # part that cannot rot and is the part that actually justifies this service
    # container: EVERY integration test in the suite is gated on DATABASE_URL,
    # so with no database the silently-skipped layer is ALL of them, whatever
    # the count happens to be this month.
    services:
      postgres:
        # Matches docker-compose.yml's postgres service exactly, so CI exercises
        # the same major version the development stack runs. A different major
        # would make CI's result inapplicable to the stack it is meant to guard.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas # pragma: allowlist secret
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        # Without a health check the job races the database: pytest can start
        # before Postgres accepts connections, the connection fails, and the
        # failure looks like a test defect rather than a startup order defect.
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Job scope, deliberately: `alembic upgrade head` and `pytest` BOTH need
    # this. Setting it on the pytest step alone would leave the migration step
    # falling back to migrations/env.py's local default host (`postgres`), which
    # does not resolve on the runner. These are non-secret CI-local values for
    # an ephemeral container that is destroyed with the job.
    env:
      DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python runtime and dev dependencies
        id: python_install
        # Install the project (runtime dependencies) plus the dev extras and the
        # editable app package so the test suite can import the application.
        #
        # `id:` exists so the steps below can name THIS step as their one
        # precondition instead of inheriting the default `success()`, which
        # depends on every step before them. Same construction as `web_install`
        # in the `web` job, which is where this idiom already lives.
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      # DELIBERATELY UNCONDITIONED, and checked rather than assumed. This is the
      # first step after the install, so it has no spurious incoming edge to
      # remove: the only thing that can silence it is the install failing, and
      # that dependency is REAL. Adding the condition the next step carries
      # would be a NO-OP here -- if the install fails or is skipped its outcome
      # is not 'success' either way -- and a clause that cannot change an
      # outcome is dead logic inside a gate. Left off on purpose; please do not
      # "tidy" it in for symmetry with the step below.
      - name: Ruff lint
        run: ruff check .
      # CONDITIONED, and this is the change. With no `if:` the default is
      # `success()`, which is true only when NO earlier step in the job failed.
      # So a failing `Ruff lint` SKIPPED this step, `Apply database migrations`
      # and `Pytest` -- and a skipped step produces no evidence at all. A
      # one-character formatting nit therefore hid the entire test suite, in a
      # job named "Python lint, format, tests" that had by then tested NOTHING.
      # Worse, the red run is the one nobody re-reads: after the nit is fixed
      # the next run is green and reads as "tests passed", when the run that
      # actually carried the defect never reached them.
      #
      # DERIVED, not inherited, by parsing this workflow and simulating each
      # step's `if:` against the outcomes before it (2026-08-25). Under the
      # model "A masks B when B is skipped in a run where A fails but would
      # have run otherwise", counting steps that carry a `run:` key, this file
      # had 22 masking edges: 15 REAL and 7 spurious.
      #
      # The 15 real ones are kept. Fourteen are dependencies on an install step
      # -- a step cannot lint with no linter installed -- and the fifteenth is
      # `Validate secrets baseline` -> `Scan tracked files against baseline` in
      # the `secrets` job, which is real for a different reason documented on
      # the step itself.
      #
      # The 7 spurious ones are removed: five here (`Ruff lint` silencing the
      # three steps below it, `Ruff format check` silencing the two below it),
      # one in `node`, and `Apply database migrations` -> `Pytest`, which is
      # the one that needed measuring rather than reasoning about and is
      # written up on the `Pytest` step below.
      #
      # A count of 17 is the SAME measurement restricted to edges whose MASKED
      # step carries no explicit `if:`. That sub-population excludes the five
      # deliberate install gates in `web`, which are edges too, merely correct
      # ones. Both figures are right about different questions; 22 is stated
      # here because the property that matters -- a failing step leaving a
      # later step with no evidence -- holds in `web` exactly as it does here.
      #
      # Spurious because these two commands share no state: `ruff check` and
      # `ruff format --check` each read the working tree and nothing else.
      # Neither produces input for the other, so running the second after the
      # first has failed yields a genuine independent finding, never noise.
      #
      # Load-bearing beyond tidiness: `tests/unit/test_url_allowlist.py` runs in
      # the `Pytest` step below and asserts that every URL host in the committed
      # tree is allowlisted -- the SECOND CI route to the disclosure rule that
      # keeps an internal hostname out of this public repository, the first
      # being the `secrets` job. VERIFIED by reading the test, not assumed: see
      # `test_every_host_in_the_committed_tree_is_allowlisted`. Before this
      # change a formatting nit switched that whole second route off.
      #
      # `!cancelled()` rather than `always()`, matching `web`, `dependencies`
      # and `secrets`. They differ on exactly one input -- a CANCELLED run --
      # and this workflow sets `cancel-in-progress: true` on `ci-${{ github.ref
      # }}`, so any second push to a branch produces that input routinely.
      # `always()` would run these steps inside a dying run and write a green
      # step into a CANCELLED one, which reads as "the gate ran and passed" to
      # anyone not also reading the run conclusion, and `cancelled` is not
      # `failure`. NOT MEASURED, stated plainly: a cancelled run was not
      # observed while making this change, so this rests on documented Actions
      # semantics and on the three jobs here that already spell it this way.
      #
      # It does not turn a red job green: a failed step fails the job whatever
      # later steps are conditioned on. Only `continue-on-error` would mask
      # that, and it is deliberately absent from this file.
      - name: Ruff format check
        if: ${{ !cancelled() && steps.python_install.outcome == 'success' }}
        run: ruff format --check .
      # A named step of its own, not folded into the pytest command: when the
      # schema is the thing that broke, the job's step list says so directly
      # instead of reporting a wall of failing tests.
      - name: Apply database migrations
        if: ${{ !cancelled() && steps.python_install.outcome == 'success' }}
        run: alembic upgrade head
      # CONDITIONED ON THE INSTALL ONLY, and NOT on the migration step above.
      # That was the one judgement call here, so it is recorded rather than
      # left for the next person to re-litigate or to "fix".
      #
      # The intuition is that tests need the schema, which would make
      # `Apply database migrations` -> `Pytest` a REAL dependency. MEASURED
      # 2026-08-25, and it is not: every integration module owns a
      # module-scoped `engine` fixture that calls `command.upgrade(config,
      # "head")` ITSELF before yielding. Pointed at a reachable but EMPTY
      # postgres:16-alpine with `alembic upgrade head` never run beforehand,
      # `python -m pytest -q` reported 2859 passed, 3 skipped, exit 0. Pytest
      # builds the schema it needs; it does not consume this step's output.
      #
      # The test that separates a REAL edge from a spurious one, applied
      # consistently across this file, is whether the later step can still
      # produce information that is NOT a restatement of the earlier failure.
      # An install edge fails it: `pytest` with no packages reports import
      # errors and nothing else. `Validate secrets baseline` -> `Scan` in the
      # `secrets` job fails it too, and is documented there for that reason.
      # This edge PASSES it: roughly 2600 tests in this suite need no database
      # at all -- including the URL-allowlist route named above -- and they
      # report their own verdict whatever the schema did. Keeping the edge
      # would trade that verdict for nothing, since the named step above
      # already attributes the cause.
      #
      # The cost is honest and accepted: on a run whose migration is broken,
      # the database-backed tests will fail too, in volume, as a consequence
      # of the failure named one step above. The step list, not the wall of
      # errors, is where a reader learns the cause -- which is exactly why that
      # step is named separately.
      - name: Pytest
        if: ${{ !cancelled() && steps.python_install.outcome == 'success' }}
        run: pytest -q

  node:
    name: Node format and lint
    runs-on: ubuntu-latest
    # SCOPE, measured rather than assumed: this job runs the ROOT package's
    # tooling and nothing else. `npm run lint` resolves through the root
    # eslint.config.js, which sets `ignores: [..., "apps/web/"]`, and MEASURED
    # with `eslint . --format json` it reports exactly ONE linted file --
    # eslint.config.js itself. Root .prettierignore excludes apps/web/ for the
    # same reason: that package carries its own Prettier and ESLint
    # configuration, with a TypeScript parser this one does not have.
    #
    # So this job is real but narrow, and it is NOT the gate on the web
    # application. Stated precisely, because overstating a gate is the defect
    # this comment exists to prevent: it is not unfailable -- breaking
    # eslint.config.js does redden it -- it simply covers one file, and cannot
    # fail on a defect in the application. The `web` job below runs apps/web's
    # own `lint` and `format:check`, which nothing in this repository invoked
    # until they were added there.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Node dev tools
        id: node_install
        # `id:` so `ESLint` below can name this step as its precondition rather
        # than inheriting `success()`. Same construction as `web_install`.
        run: npm ci
      # Unconditioned for the same reason `Ruff lint` is: first step after the
      # install, no spurious incoming edge, so a condition here would be a
      # no-op.
      - name: Prettier check
        run: npm run format:check
      # The sixth and last spurious masking edge in this file. With no `if:`,
      # `Prettier check` failing SKIPPED this step entirely, so a formatting
      # difference hid every lint finding in the same job -- one finding hiding
      # the rest, which is the rule `web` and `dependencies` already state in
      # their own comments.
      #
      # Spurious on the same test used in the `python` job: `npm run
      # format:check` and `npm run lint` both read the tree and neither
      # consumes the other's output, so this step still returns an independent
      # finding after Prettier has failed. The install edge above it is REAL
      # and is kept: with no node_modules this reports a missing binary, which
      # is noise dressed as a finding.
      - name: ESLint
        if: ${{ !cancelled() && steps.node_install.outcome == 'success' }}
        run: npm run lint

  web:
    name: Web type-check, tests, and build
    runs-on: ubuntu-latest
    # Before this job, apps/web received exactly ONE CI operation in the whole
    # workflow: `npm audit` in the `dependencies` job, which reads the lockfile
    # and installs nothing. The `node` job above runs `npm ci` with no
    # working-directory -- the repository root -- and the root package.json
    # declares no `workspaces`, so that install cannot reach this package.
    #
    # apps/web nonetheless declares `tsc -b`, `vitest run` (9 files, 110 tests)
    # and `vite build`, and apps/web/Dockerfile executes `npm ci` and
    # `npm run build` to produce the assets that actually ship. None of it ran
    # here. A TypeScript error or a failing web test merged green, and not one
    # of the 336 `integrity` digests in apps/web/package-lock.json was enforced
    # by anything, because only `npm ci` checks them and `npm audit` does not.
    #
    # A separate job rather than more steps on `node`, deliberately: the jobs
    # run in parallel, so this adds no critical path while `python` (a full
    # toolchain install plus the suite against a postgres service container)
    # remains the long pole, and a red check named for the web app is
    # attributable without opening a log -- which the same failure buried in a
    # job called "Node format and lint" would not be.
    defaults:
      run:
        # Every `run` step here belongs to this package. Set once on the job
        # rather than repeated per step; `uses` steps are unaffected.
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the other Node jobs, apps/web's own `engines.node` (>=20)
          # and the node:20-alpine base in apps/web/Dockerfile, so CI exercises
          # the major version the image is built with.
          node-version: "20"
      - name: Install apps/web dependencies
        id: web_install
        run: npm ci
      # apps/web's OWN ESLint, which nothing in this repository invoked before.
      # Two independent slices reached the same measurement by different routes:
      # the root eslint.config.js ignores `apps/web/`, and `eslint . --format
      # json` at the repository root returns exactly ONE linted file. So the job
      # named "Node format and lint" could not fail on any defect in the web
      # application -- an identical `no-undef` error exits 1 at the root and 0
      # under apps/web/src. This package's own config has the TypeScript parser
      # and the React hooks rules; running it here is what makes the coverage
      # real rather than nominal.
      #
      # Placed in this job rather than a new one because a job already installs
      # this package, and rather than in `node` because that job never installs
      # it. Conditioned exactly as the steps below are, and NOT chained to them:
      # a lint error must not hide a failing test, nor a type error a lint
      # error. One finding must not hide the rest.
      - name: ESLint (apps/web)
        if: ${{ !cancelled() && steps.web_install.outcome == 'success' }}
        run: npm run lint
      # The formatter has the same hole for the same reason: root
      # .prettierignore contains `apps/web/`, so the root Prettier check never
      # reads a single file of this package.
      - name: Prettier check (apps/web)
        if: ${{ !cancelled() && steps.web_install.outcome == 'success' }}
        run: npm run format:check
      # Its own step rather than being left to `npm run build`, which is
      # `tsc -b && vite build`. Folded together, a type error and a bundler
      # error land on the same line of the step list and neither gate can be
      # shown to fail on its own -- and a gate nobody can make fail is worse
      # than no gate, because it reads as coverage.
      - name: TypeScript type check
        if: ${{ !cancelled() && steps.web_install.outcome == 'success' }}
        run: npm run typecheck
      # Runs even when the type check failed, following the same rule the
      # `dependencies` job states: one finding must not hide the rest. That is
      # load-bearing here rather than tidy, because Vitest transforms
      # TypeScript with esbuild, which strips types WITHOUT checking them -- so
      # a type error does not fail a test run, and gating this step on the
      # previous one would let a type error mask a genuinely failing test.
      #
      # Conditioned on the install rather than on `!cancelled()` alone: with no
      # node_modules the remaining steps report a missing binary, which is
      # noise dressed as a finding.
      - name: Vitest
        if: ${{ !cancelled() && steps.web_install.outcome == 'success' }}
        run: npm test
      - name: Vite production build
        if: ${{ !cancelled() && steps.web_install.outcome == 'success' }}
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # Full history so the baseline validator can resolve the fork point with
      # origin/main and compare against it. A shallow clone has no merge base,
      # which would silently downgrade the directional checks to skipped.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install detect-secrets
        run: python -m pip install --disable-pip-version-check detect-secrets==1.5.0
      # Runs BEFORE the scan, deliberately. detect-secrets-hook REWRITES the
      # baseline when it decides to update it, so scanning first would repair the
      # corruption in place and measure the repair instead of the committed state.
      # Measured on Linux: a baseline whose keys were backslashed by a Windows
      # write is silently rewritten back to posix by the hook, and without this
      # step the corrupted commit is the thing that ships.
      - name: Validate secrets baseline
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          python scripts/check_secrets_baseline.py --require-reference
      # detect-secrets-hook exits 0 clean, 1 findings, and 3 when it has REWRITTEN
      # the baseline. Two forms were rejected before this one, each of which keeps
      # one necessary property and loses the other:
      #
      #   git ls-files -z | xargs -0 ...  null-safe, but `xargs` collapses every
      #                                   child code from 1 to 125 into 123, so
      #                                   "a secret was found" and "the baseline
      #                                   changed under us" are indistinguishable.
      #   ... $(git ls-files)             keeps the true code, but word-splits on
      #                                   whitespace. MEASURED: a secret planted in
      #                                   'q2 dir/has space.txt' exits 0 - a silent
      #                                   pass on a real secret, in the one route
      #                                   that blocks a merge.
      #
      # Reading NUL-delimited names into an array keeps both.
      #
      # REPORTING RULE, and it is why this step is longer than the work it does:
      # a branch may assert only what it has ESTABLISHED. This step used to map
      # exit 1 to the single sentence "detect-secrets found a secret that is not
      # in the baseline." MEASURED with the pinned detect-secrets 1.5.0: exit 1
      # is ALSO what the hook returns when the baseline is present but unstaged,
      # where its own output one line above reads "Your baseline file
      # (.secrets.baseline) is unstaged." and no secret exists anywhere; an
      # invalid --baseline path exits 2. One status, several causes. Wrong in
      # the ALARMING direction: a reader who trusts the annotation raises a
      # false alarm, and one who "fixes" it by editing .secrets.baseline does
      # real damage. That has happened three times on this project. The same
      # repair was merged for the two local check scripts in PR #80; CI runs on
      # Linux, so this side stayed wrong until now.
      #
      # DELIBERATELY LEFT UNCONDITIONED, having been checked rather than assumed.
      # This step is skipped when `Validate secrets baseline` fails, which is the
      # same masking shape the step below was fixed for -- but here the
      # dependency is REAL. The validator runs first precisely because
      # detect-secrets-hook REWRITES the baseline; run this step on a baseline
      # already ESTABLISHED corrupt and the hook rewrites that corruption, this
      # step's own byte comparison then reports "detect-secrets REWROTE
      # .secrets.baseline", and that annotation is a CONSEQUENCE of the finding
      # one step above rather than an independent one. Noise dressed as a
      # finding -- the reason the `web` job conditions on its install outcome
      # rather than on `!cancelled()` alone. The step below has no comparable
      # dependency, which is why it gets the opposite treatment.
      - name: Scan tracked files against baseline
        shell: bash
        run: |
          set -o pipefail
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(git ls-files -z)
          echo "Scanning ${#files[@]} tracked file(s)."
          # An impossible-value assertion on this step's own instrument, not a
          # defensive flourish. MEASURED: the hook exits 0 and prints NOTHING AT
          # ALL when handed no filenames. MEASURED under this runner's shell
          # (bash --noprofile --norc -eo pipefail): nounset is off, so an empty
          # array expands to zero arguments, and errexit does NOT abort on a
          # command that fails inside a process substitution - so a broken file
          # enumeration leaves this list empty in silence. The line above would
          # then print "Scanning 0 tracked file(s)." and the step would report a
          # clean scan of nothing at all: the same defect as the exit-1 branch
          # below, pointing the reassuring way instead of the alarming one, and
          # therefore far likelier to survive unnoticed. This repository can
          # never legitimately have zero tracked files.
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "::error::No files were enumerated, so nothing was scanned. This is NOT a clean result: a scan of zero files always exits 0, so the file enumeration itself failed or produced nothing."
            exit 1
          fi
          # A REWRITE is ESTABLISHED by comparing the bytes, never read off the
          # exit code, so it can be named whatever status the hook returned.
          # `cmp` is POSIX and present on every runner image; `sha256sum` is not.
          baseline_copy=""
          if [[ -f .secrets.baseline ]]; then
            baseline_copy="$(mktemp)"
            cp -- .secrets.baseline "${baseline_copy}"
          fi
          out_file="$(mktemp)"
          err_file="$(mktemp)"
          status=0
          detect-secrets-hook --baseline .secrets.baseline "${files[@]}" >"${out_file}" 2>"${err_file}" || status=$?
          rewritten=0
          if [[ -n "${baseline_copy}" ]] && ! cmp -s -- "${baseline_copy}" .secrets.baseline; then
            rewritten=1
          fi
          if [[ "${status}" -eq 0 && "${rewritten}" -eq 0 ]]; then
            echo "Secret scan clean."
            exit 0
          fi
          # The hook's own words, surfaced immediately before the annotation
          # rather than left further up the log, because the annotation is what
          # a reader sees first and it deliberately no longer supplies a cause.
          if [[ -s "${out_file}" || -s "${err_file}" ]]; then
            echo "detect-secrets-hook said:"
            sed -e 's/^/  /' -- "${out_file}" "${err_file}"
          else
            echo "detect-secrets-hook produced no output."
          fi
          if [[ "${rewritten}" -eq 1 ]]; then
            echo "::error::detect-secrets REWROTE .secrets.baseline. Its bytes on disk changed, which this step established by comparison and which is NOT a secret finding: the committed baseline is stale or was written on a platform that uses a different path separator. Refresh it with scripts/refresh_secrets_baseline.py and commit the result."
            git --no-pager diff --stat -- .secrets.baseline
            exit 1
          fi
          echo "::error::detect-secrets-hook exited ${status}. Its own output is printed immediately above and is the authoritative statement of what happened; this workflow does not infer a cause from the exit code. Exit 1 alone means a secret outside the baseline OR an unstaged baseline OR an argument error, and this step cannot tell those apart."
          exit 1
      # Disclosure guard: every URL host in a tracked file must be on the
      # reviewed public allowlist. Stdlib-only, so it needs no install step.
      # Kept inside this job rather than a new one so the existing required
      # check name is unchanged.
      #
      # CONDITIONED, and the condition is the point. With no `if:` the default is
      # `success()`, so GitHub SKIPPED this step whenever ANY earlier step in the
      # job failed. MEASURED on a control PR against this file: plant one
      # high-entropy string, `Scan tracked files against baseline` reports
      # `failure` and this step reports `skipped`. It is skipped by the validator
      # failing too, so two separate edges reached it. The effect is that the
      # guard keeping an internal hostname out of a PUBLIC repository stopped
      # running at exactly the moment another guard had just fired -- when the
      # tree is known to be in an unexpected state and scrutiny should be
      # highest. One finding hid the rest, which is the rule the `dependencies`
      # job states in its own comments and the `web` job already follows.
      #
      # Sound HERE because this step depends on neither step above it:
      # scripts/check_urls.py is stdlib-only, shells out to `git ls-files` and
      # reads the checkout. It needs no detect-secrets and no valid
      # .secrets.baseline, so there is no state in which running it after their
      # failure yields noise instead of a finding. Contrast the note on the
      # previous step, whose dependency IS real.
      #
      # `!cancelled()` rather than `always()`, deliberately. They differ on
      # exactly one input -- a CANCELLED run -- and this workflow sets
      # `cancel-in-progress: true` on `ci-${{ github.ref }}`, so that input
      # occurs routinely: any second push to a branch cancels the run in flight.
      # `always()` would execute this step inside that dying run, spending a
      # runner on a result nobody will read and writing a green step into a
      # CANCELLED run -- which reads as "the guard ran and passed" to anyone who
      # does not also read the run conclusion, and `cancelled` is not `failure`.
      # `!cancelled()` keeps the only behaviour this change needs, running after
      # a FAILED step, and is the spelling the `web` and `dependencies` jobs
      # already use, so the file gains no second idiom for one intent.
      #
      # It does not turn a red job green: a failed step fails the job whatever
      # later steps are conditioned on or report. Only `continue-on-error` would
      # mask that, and it is deliberately absent. VERIFIED at JOB conclusion on a
      # control PR rather than assumed, because that is the exact way an
      # `always()`-shaped change goes wrong unnoticed.
      - name: URL host allowlist
        if: ${{ !cancelled() }}
        run: python scripts/check_urls.py

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit==2.9.0
      # apps/api/Dockerfile installs exactly this file into the runtime image,
      # so it is the production Python surface. It was previously audited by
      # nothing: this job only ever read requirements-dev.txt, which contains
      # development tooling that never ships.
      - name: Audit Python production dependencies (apps/api)
        run: pip-audit -r apps/api/requirements.txt
      # Every audit below runs even when an earlier one fails, so one finding
      # never hides the rest. The job still fails: this reports more, not less.
      #
      # apps/worker/Dockerfile installs this second file into the worker and
      # scheduler image. It is a subset of the API's pins, but a subset is not
      # a duplicate: it can drift, and auditing apps/api alone would leave a
      # shipped image uncovered.
      - name: Audit Python production dependencies (apps/worker)
        if: ${{ !cancelled() }}
        run: pip-audit -r apps/worker/requirements.txt
      - name: Audit Python development dependencies
        if: ${{ !cancelled() }}
        run: pip-audit -r requirements-dev.txt
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: "20"
      # Audited WITH development dependencies, deliberately. `--omit=dev` cannot
      # fail here and so carries no information: the root package declares zero
      # production dependencies, and apps/web's two production dependencies
      # carry no advisories, so both commands reduce to a guaranteed
      # "found 0 vulnerabilities". The development tree is genuine build-time
      # exposure -- apps/web/Dockerfile runs `npm ci` with it present to produce
      # the static assets that ship -- so it is the surface worth gating on.
      - name: Audit Node dependencies (repo root tooling)
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high
      # apps/web is a separate install (the root package declares no npm
      # workspaces), so a root-only audit never reads it.
      - name: Audit Node dependencies (apps/web)
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: npm audit --audit-level=high
