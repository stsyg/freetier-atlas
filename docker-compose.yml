# FreeTier Atlas — local development stack.
#
# Slice 1 brought up PostgreSQL and the FastAPI API. Slice 2 added the worker and
# scheduler services (a PostgreSQL-backed job queue). Slice 3 adds the React web
# frontend (nginx-served static build, reverse-proxying /api/ to the api service).
#
# Values are sourced from a local .env file (copy .env.example -> .env). The
# defaults are non-secret local development values and MUST NOT be used in any
# deployed environment.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - atlas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-atlas}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        # Optional Python package-index overrides for restricted networks.
        # These use the "no value" form on purpose: Compose then passes the
        # variable through ONLY when it is set in the environment Compose runs
        # in, leaving the build arg genuinely unset otherwise (an empty value
        # would break pip). Unset => public PyPI, exactly as before. Set them in
        # your shell or .env; never commit a feed URL. See .env.example.
        PIP_INDEX_URL:
        PIP_EXTRA_INDEX_URL:
        PIP_TRUSTED_HOST:
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://atlas:atlas@postgres:5432/atlas} # pragma: allowlist secret
      APP_ENV: ${APP_ENV:-development}
      # First runtime consumer of the llm-providers config (F007). The example
      # config ships every provider disabled, so the assisted adviser always
      # takes the deterministic path; no credential values are mounted (only the
      # non-secret example file, read-only).
      LLM_CONFIG_PATH: ${LLM_CONFIG_PATH:-/app/config/llm-providers.yaml}
      # Server secret for the abuse layer (F007 slice 2): keys the HMAC IP hash
      # and signs proof-of-work challenges. The default is a NON-SECRET local
      # development value and MUST be overridden in any deployed environment.
      ABUSE_SECRET: ${ABUSE_SECRET:-dev-abuse-secret-change-me} # pragma: allowlist secret
      # Private admin surface (F007 slice 4): GitHub-OAuth login restricted to an
      # allowlist, with a stateless signed session cookie. The signing key is a
      # NON-SECRET local default and MUST be overridden in any deployed
      # environment; the OAuth client secret is supplied by the environment only
      # (never committed) and is empty by default (login denies until set).
      ADMIN_ENABLED: ${ADMIN_ENABLED:-true}
      ADMIN_GITHUB_CLIENT_ID: ${ADMIN_GITHUB_CLIENT_ID:-}
      ADMIN_GITHUB_CLIENT_SECRET: ${ADMIN_GITHUB_CLIENT_SECRET:-} # pragma: allowlist secret
      ADMIN_COOKIE_SIGNING_KEY: ${ADMIN_COOKIE_SIGNING_KEY:-dev-admin-signing-key-change-me} # pragma: allowlist secret
      ADMIN_ALLOWLIST: ${ADMIN_ALLOWLIST:-stsyg}
      ADMIN_BASE_URL: ${ADMIN_BASE_URL:-http://localhost:8080}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-true}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-28800}
      # OAuth endpoints default to github.com; they are configurable so a
      # GitHub Enterprise / self-hosted host (or an offline smoke double) can be
      # targeted without any code change. They are never networked in CI.
      ADMIN_OAUTH_AUTHORIZE_URL: ${ADMIN_OAUTH_AUTHORIZE_URL:-https://github.com/login/oauth/authorize}
      ADMIN_OAUTH_TOKEN_URL: ${ADMIN_OAUTH_TOKEN_URL:-https://github.com/login/oauth/access_token} # pragma: allowlist secret
      ADMIN_OAUTH_USER_URL: ${ADMIN_OAUTH_USER_URL:-https://api.github.com/user}
    volumes:
      - ./config/examples/llm-providers.example.yaml:/app/config/llm-providers.yaml:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'python -c "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen(''http://localhost:8000/health'', timeout=3).status==200 else sys.exit(1)"'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        # See the api service above: pass-through only when set.
        PIP_INDEX_URL:
        PIP_EXTRA_INDEX_URL:
        PIP_TRUSTED_HOST:
    command: ["python", "-m", "worker.main"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://atlas:atlas@postgres:5432/atlas} # pragma: allowlist secret
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-2}
      HEARTBEAT_STALE_SECONDS: ${HEARTBEAT_STALE_SECONDS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "worker.health", "--service", "worker"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        # See the api service above: pass-through only when set.
        PIP_INDEX_URL:
        PIP_EXTRA_INDEX_URL:
        PIP_TRUSTED_HOST:
    command: ["python", "-m", "worker.scheduler"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://atlas:atlas@postgres:5432/atlas} # pragma: allowlist secret
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-5}
      HEARTBEAT_STALE_SECONDS: ${HEARTBEAT_STALE_SECONDS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "worker.health", "--service", "scheduler"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  atlas_pgdata:
